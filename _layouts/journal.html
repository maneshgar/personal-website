<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>{% if page.title and page.title != "Journal" %}{{ page.title }} · {% endif %}Journal · {{ site.title }}</title>
	<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
	<meta name="author" content="{{ site.author }}">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="canonical" href="{{ page.url | absolute_url }}">
	<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
	<meta property="og:title" content="{{ page.title | default: 'Journal' }}">
	<meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
	<meta property="og:url" content="{{ page.url | absolute_url }}">
	<meta property="og:image" content="{{ page.cover | default: page.image | default: '/images/profilepic.png' | absolute_url }}">
	{% feed_meta %}

	<link rel="preload" href="/css/fonts/opensans/OpenSans-Regular-webfont.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="/css/fonts/opensans/OpenSans-Bold-webfont.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="/css/fonts.css">
	<link rel="stylesheet" href="/css/fontello/css/fontello.css">
	<link rel="stylesheet" href="/css/font-awesome/css/font-awesome.min.css">
	<link rel="stylesheet" href="/css/default.css">
	<link rel="stylesheet" href="/css/layout.css">
	<link rel="stylesheet" href="/css/journal.css">
	<link rel="stylesheet" href="/css/dark.css">
	{% include theme-head.html %}
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v2.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v2.png">
	<link rel="icon" type="image/png" sizes="192x192" href="/icon-192-v2.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png">
</head>

<body class="journal-page">

<nav class="w-topbar">
	<div class="w-topbar-inner">
		<a class="w-brand" href="/">Behnam Maneshgar</a>
		<ul class="w-nav">
			<li><a href="/#about">Bio</a></li>
			<li><a href="/#resume">Resume</a></li>
			<li><a href="/#contact">Contact</a></li>
			<li class="nav-page"><a href="/journal/" class="current">Journal</a></li>
			<li class="nav-theme">{% include theme-toggle.html %}</li>
		</ul>
	</div>
</nav>

<main class="w-main">
{{ content }}
</main>

<footer>
	<div class="row">
		<div class="twelve columns">
			<ul class="social-links">
				<li><a href="https://ca.linkedin.com/in/bmaneshgar" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa fa-linkedin"></i></a></li>
				<li><a href="https://www.instagram.com/behnam_maneshgar/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa fa-instagram"></i></a></li>
				<li><a href="/journal/feed.xml" aria-label="RSS feed"><i class="fa fa-rss"></i></a></li>
			</ul>
			<ul class="copyright">
				<li>&copy; {{ site.time | date: '%Y' }} {{ site.author }}</li>
			</ul>
		</div>
	</div>
</footer>

</body>
</html>
