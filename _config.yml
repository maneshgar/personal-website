# Site settings for GitHub Pages (Jekyll)
title: Behnam Maneshgar
description: News, books, finance and notes on what I'm learning, by Behnam Maneshgar.
author: Behnam Maneshgar
url: https://maneshgar.com
baseurl: ""

# Journal (blog)
permalink: /journal/:year/:title/
timezone: America/Vancouver
excerpt_separator: <!--more-->

# The topics shown as filters on the Journal page.
# Add a new one here, then use its key in a post's `tags:`.
journal_tags:
  news: News
  ai: "AI/ML"
  projects: My Projects
  books: Books
  finance: Finance
  notes: Notes

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

feed:
  path: journal/feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - JOURNAL.md
  - Gemfile
  - Gemfile.lock
  - vendor
